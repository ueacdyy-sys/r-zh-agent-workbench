name: R package check

on:
  push:
  pull_request:

jobs:
  rstudiozhai:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/rstudiozhai
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/rstudiozhai
          extra-packages: any::rcmdcheck
          needs: check
      - name: Run base tests
        shell: pwsh
        run: Rscript tests/base/run-tests.R
      - name: Check package
        shell: pwsh
        run: Rscript -e "rcmdcheck::rcmdcheck(args = c('--no-manual', '--no-build-vignettes'), error_on = 'warning')"
