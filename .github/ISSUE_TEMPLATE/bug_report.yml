name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include exact commands or UI steps.
    validations:
      required: true
  - type: input
    id: rstudio-version
    attributes:
      label: RStudio version
      placeholder: "2026.05.0+218"
  - type: input
    id: r-version
    attributes:
      label: R version
      placeholder: "4.6.0"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove API keys, tokens, passwords, customer data, and private paths before posting.
