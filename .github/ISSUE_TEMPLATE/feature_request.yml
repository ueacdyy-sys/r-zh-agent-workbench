name: Feature request
description: Propose a workflow or product improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which RStudio workflow friction does this reduce?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the feature from the user's point of view.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - R package Addin
        - Localizer
        - AI provider gateway
        - Quarto report factory
        - Data connections
        - Documentation
        - Other
    validations:
      required: true
